framework:
    secret: 'test-secret'
    test: true
    session:
        storage_factory_id: session.storage.factory.mock_file
    router:
        utf8: true
    csrf_protection: true
    http_method_override: false
    handle_all_throwables: true
    php_errors:
        log: true
    validation:
        email_validation_mode: html5
    translator:
        default_path: '%kernel.project_dir%/translations'
        fallbacks: ['fr']
    default_locale: fr
    enabled_locales: ['fr', 'en']
    set_locale_from_accept_language: true
    property_info:
        with_constructor_extractor: true
    asset_mapper:
        paths: ['assets/']
        importmap_path: '%kernel.project_dir%/config/importmap.php'
    # Limiter state in memory, per kernel (test.rate_limiter_storage): the browser reboots
    # it between requests, so counters only add up in a test that calls disableReboot()
    # (RateLimitTest).
    rate_limiter:
        gingerminds_core_api:
            storage_service: test.rate_limiter_storage
        test_strict:
            policy: fixed_window
            limit: 1
            interval: '1 minute'
            storage_service: test.rate_limiter_storage

doctrine:
    dbal:
        url: 'sqlite:///%kernel.cache_dir%/test.db'
    orm:
        enable_native_lazy_objects: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: false
        mappings:
            TestApplication:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/Entity'
                prefix: 'Gingerminds\CoreBundle\Tests\Application\Entity'

twig:
    default_path: '%kernel.project_dir%/templates'

api_platform:
    title: 'Gingerminds core test API'
    mapping:
        paths: ['%kernel.project_dir%/Entity']
    formats:
        jsonld: ['application/ld+json']
        json: ['application/json']
    patch_formats:
        json: ['application/merge-patch+json', 'application/json']
    defaults:
        stateless: true
        pagination_client_items_per_page: true

security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: auto
            cost: 4
            time_cost: 3
            memory_cost: 10
    providers:
        gingerminds_users:
            id: gingerminds_core.security.user_provider
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js|assets)/
            security: false
        api:
            pattern: ^/api
            stateless: true
            provider: gingerminds_users
            access_token:
                token_handler: gingerminds_core.security.api_token_handler
                failure_handler: gingerminds_core.security.api_failure_handler
        admin:
            lazy: true
            provider: gingerminds_users
            form_login:
                login_path: gingerminds_core_login
                check_path: gingerminds_core_login
                default_target_path: gingerminds_core_dashboard
                enable_csrf: true
            login_throttling:
                max_attempts: 5
                interval: '5 minutes'
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
            logout:
                path: gingerminds_core_logout
                target: gingerminds_core_login
    access_control:
        - { path: ^/admin/login$, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: IS_AUTHENTICATED }

gingerminds_core:
    admin_includes:
        head: ['admin/_head_include.html.twig']
        sidebar: ['admin/_sidebar_include.html.twig']
        sidebar_bottom: ['admin/_sidebar_bottom_include.html.twig']
    api:
        rate_limit:
            limit: 3
    # AdminTest: global value (edit -> list) and a per resource override (permission).
    redirect_after_save:
        edit: index
    resources:
        permission:
            redirect_after_new: edit
        category:
            entity: Gingerminds\CoreBundle\Tests\Application\Entity\Category
