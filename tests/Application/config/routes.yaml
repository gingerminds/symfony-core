gingerminds_core:
    resource: '@GingermindsCoreBundle/config/routes.php'

api_platform:
    resource: .
    type: api_platform
    prefix: /api

# RateLimitTest: `_rate_limiter` route default, outside and inside the API prefix.
test_rate_limited:
    path: /rate-limited
    controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController::urlRedirectAction
    defaults: { path: /, _rate_limiter: test_strict }

test_api_unlimited:
    path: /api/unlimited
    controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController::urlRedirectAction
    defaults: { path: /, _rate_limiter: false }
